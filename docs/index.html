<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IHKLW Quiz</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <div class="header">

        <img src="logo.png" class="logo" alt="IHKLW Logo">

        <h1 id="quiz-title">
        IHKLW Wissensquiz
        </h1>

        <p id="quiz-subtitle">
        Wirtschaft • Lüneburg • IHKLW
        </p>
    </div>


    <!-- STARTSEITE -->
    <div id="start-screen">

        <h2>Willkommen!</h2>

        <p>
            Teste dein Wissen rund um die IHK.
        </p>

        <button onclick="startQuiz()">
            Quiz starten
        </button>

    </div>

    <!-- QUIZ -->
    <div id="quiz-container" class="hidden">

        <div id="question-number"></div>

        <h2 id="question"></h2>

        <div id="answers"></div>

        <div class="progress">
            <div id="progress-bar"></div>
        </div>

    </div>

    <!-- ERGEBNIS -->
    <div id="result-container" class="hidden">

        <h2>Quiz beendet!</h2>

        <p id="score"></p>

        <p id="rating"></p>

        <button onclick="restartQuiz()">
            Quiz erneut starten
        </button>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
